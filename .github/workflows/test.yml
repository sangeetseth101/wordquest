name: Test WordQuest
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: node --check public/app.js
      - run: node --check public/boot.js
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wordquest_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: wordquest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wordquest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
        env:
          WORDQUEST_TEST_POSTGRES_URL: postgresql://wordquest_test:test_only_password@127.0.0.1:5432/wordquest_test?sslmode=disable
